<body oncontextmenu="return false;">
	<main id="maincanvas"></main>
	<div id="appgui"></div>
	<div id="appgui_splitter"></div>
	<dialog id="newOperatorDialog" popover>
		<div id="newOperatorSelection"></div>
		<div id="dialog-bottom">
			<input id="newOperatorSearch" type="text" placeholder="Search...">
			<button popovertarget="newOperatorDialog" popovertargetaction="hide">Cancel</button>
		</div>
		<div id="dialog-info-box">
			<div id="dialog-info-box-title">sdfgsdfgsdfgdf dfgsdfgd</div>
			<div id="dialog-info-box-body">sdfgsd fgsdfgsdfgs dfgsdfgdsfg sdfg sdfg ssdfgsdfg sd sdfgsd fsdfg sdfg sdfgsdf gsdfg sdfg dfg sdfg </div>
		</div>
	</dialog>
	<!-- Willkommens-Meldung und Tour (js/welcome.js). Die Texte setzt das Skript
	     in der Sprache, die auch das Wiki zeigt; Platz und Sichtbarkeit der
	     Bereiche wechseln zwischen Begruessung und Tour-Schritt. -->
	<div id="welcomeBackdrop" hidden></div>
	<div id="welcomeBox" hidden>
		<button id="welcomeClose" type="button">&times;</button>
		<div id="welcomePreview">
			<img id="welcomePreviewImage" src="gfx/welcome-preview.png" width="1360" height="690" alt="">
		</div>
		<h2 id="welcomeTitle"></h2>
		<div id="welcomeText"></div>
		<div id="welcomeStep" hidden></div>
		<!-- Nur am Ende der Grundtour: das Angebot, die erweiterte Tour anzuschliessen -->
		<div id="welcomeExtra" hidden>
			<button id="welcomeAdvanced" type="button" class="welcome-button welcome-primary"></button>
		</div>
		<div id="welcomeIntroActions">
			<button id="welcomeStart" type="button" class="welcome-button welcome-primary"></button>
			<button id="welcomeDecline" type="button" class="welcome-button"></button>
		</div>
		<div id="welcomeTourActions" hidden>
			<button id="welcomeBack" type="button" class="welcome-button"></button>
			<button id="welcomeNext" type="button" class="welcome-button welcome-primary"></button>
		</div>
		<div id="welcomeFooter">
			<label id="welcomeAgain">
				<input id="welcomeAgainBox" type="checkbox">
				<span id="welcomeAgainLabel"></span>
			</label>
			<a id="welcomeWiki" href="wiki.html"></a>
		</div>
	</div>

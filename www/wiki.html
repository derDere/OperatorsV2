<!DOCTYPE html>
<!-- Das lang-Attribut folgt zur Laufzeit der angezeigten Wiki-Sprache (wiki.js) -->
<html lang="en">

<head>
	<link rel="shortcut icon" href="favicon.png" type="image/x-icon">
	<title>OperatorsV2 Wiki</title>

	<script src="libs/p5.js"></script>

	<link rel="stylesheet" type="text/css" href="css/style.css">
	<link rel="stylesheet" type="text/css" href="css/app.css">
	<link rel="stylesheet" type="text/css" href="css/wiki.css">
	<meta charset="utf-8" />

</head>

<body class="wiki">
	<header id="wiki-header">
		<div id="wiki-header-left">
			<!-- Das Wiki-Fenster öffnet oft ohne Browser-Menüleiste — dieser Knopf ersetzt den Zurück-Button des Browsers -->
			<button id="wiki-back" type="button">
				<img src="gfx/arrow-left.svg" alt="" width="18" height="18">
			</button>
			<a href="#index" id="wiki-title">OperatorsV2 Wiki</a>
		</div>
		<div id="wiki-header-right">
			<div id="wiki-search-box">
				<input type="search" id="wiki-search" autocomplete="off">
				<div id="wiki-search-results" hidden></div>
			</div>
			<!-- Sprachwahl: vorbelegt aus der Browsersprache, per Hand umschaltbar (wiki.js).
			     Flaggen (gfx/flag-*.svg) statt Text, damit die Auswahl selbst keine
			     Übersetzung braucht; der Knopf zeigt die Flagge der angezeigten Sprache
			     (kopiert aus der Liste) -->
			<div id="wiki-lang">
				<button id="wiki-lang-current" type="button"></button>
				<div id="wiki-lang-options" hidden>
					<button type="button" data-lang="de" title="Deutsch">
						<img class="wiki-lang-flag" src="gfx/flag-de.svg" alt="Deutsch" width="24" height="16">
					</button>
					<button type="button" data-lang="en" title="English">
						<img class="wiki-lang-flag" src="gfx/flag-us.svg" alt="English" width="24" height="16">
					</button>
				</div>
			</div>
		</div>
	</header>
	<main id="wiki-content"></main>
	<script src="js/ws.js"></script>
	<script src="js/control.js"></script>
	<script src="js/movable.js"></script>
	<script src="js/router.js"></script>
	<script src="js/lines/connection_line.js"></script>
	<script src="js/lines/direkt.js"></script>
	<script src="js/lines/bezier.js"></script>
	<script src="js/lines/simple_bezier_fan.js"></script>
	<script src="js/lines/simple_bezier.js"></script>
	<script src="js/lines/chip_path.js"></script>
	<script src="js/connection.js"></script>
	<script src="js/operator.js"></script>
	<script src="js/operators/placeable.js"></script>
	<script src="js/operators/simple.js"></script>
	<script src="js/operators/ui_ios.js"></script>
	<script src="js/operators/display.js"></script>
	<script src="js/operators/7segment.js"></script>
	<script src="js/operators/logic.js"></script>
	<script src="js/operators/advanced.js"></script>
	<script src="js/operators/terminal_display.js"></script>
	<script src="js/operators/line_display.js"></script>
	<script src="js/operators/functional.js"></script>
	<script src="js/operators/organisation.js"></script>
	<script src="js/operators/vectors.js"></script>
	<script src="js/operators/portals.js"></script>
	<script src="js/operators/network.js"></script>
	<script src="js/operators/file.js"></script>
	<script src="js/op_demo.js"></script>
	<script src="js/wiki.js"></script>
	<script src="js/wiki_search.js"></script>
</body>

</html>

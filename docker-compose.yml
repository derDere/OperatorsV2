# docker-compose.yml -- Stack fuer OperatorsV2
#
# Ein Service: der Node-Webserver (eigenes Image aus server/Dockerfile), der den
# gemounteten www-Ordner ausliefert. Hochfahren/Stoppen NUR ueber die Make-Befehle
# (make start / stop / wait / logs), nicht docker compose direkt.

name: ${COMPOSE_PROJECT_NAME:-operatorsv2}

services:

  web:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-operatorsv2}-web
    volumes:
      - ./www:/www:ro
      - ./wiki:/wiki:ro
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      # Betriebsbereit, sobald die Startseite ausgeliefert wird -- darauf wartet `make wait`.
      # In der Startphase wird alle 500ms geprueft (localhost: was nach 0.5s nicht
      # antwortet, ist noch nicht an), im Regelbetrieb danach nur noch alle 30s.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 15s
      start_interval: 500ms
      interval: 30s
      timeout: 500ms
      retries: 3
    networks:
      - internal
    restart: unless-stopped

networks:
  # Internes Stack-Netz -- spaetere Komponenten erreichen sich ueber den Service-Namen.
  internal:
    driver: bridge
